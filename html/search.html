<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пошук — STEPUP</title>
<meta name="description" content="Пошук взуття за назвою або брендом у STEPUP.">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-mode="search">
<div id="site-header"></div>
<main class="wrap">
  <div class="crumbs"><a href="index.html" data-i18n="home"></a> / <span data-i18n="search"></span></div>
  <form id="search-form" role="search" style="display:flex;gap:8px;max-width:560px;margin:8px 0 24px">
    <input type="search" data-i18n-ph="search_ph" data-i18n-aria="search" style="flex:1;height:52px;border:1.5px solid var(--ink);border-radius:999px;padding:0 22px;min-width:0">
    <button class="btn btn-primary" data-i18n="search"></button>
  </form>
  <div class="cat-head">
    <div><h1 id="title" style="font-size:clamp(1.6rem,3vw,2.4rem)"></h1><p class="muted" id="count" aria-live="polite"></p></div>
    <div class="toolbar">
      <button class="btn btn-ghost filter-toggle" id="open-f"><span data-i18n="filters"></span></button>
      <select class="select" id="sort" aria-label="Sort"></select>
      <div class="seg" id="view"><button data-v="grid" class="on" aria-label="Grid">▦</button><button data-v="list" aria-label="List">☰</button></div>
    </div>
  </div>
  <div class="tags" id="tags"></div>
  <div class="layout">
    <aside class="filters" id="filters" aria-label="Filters">
      <div style="display:flex;justify-content:space-between;align-items:center"><h3 data-i18n="filters"></h3><button class="icon-btn" id="close-f" style="display:none" aria-label="Close">✕</button></div>
      <div id="filters-body"></div>
      <button class="btn btn-primary btn-block filter-toggle" id="apply" style="margin-top:16px"></button>
    </aside>
    <div><div id="grid"></div><div class="more" id="more"></div></div>
  </div>
</main>
<div class="drawer-mask" id="fmask"></div>
<div id="site-footer"></div>
<style>@media(max-width:900px){#close-f{display:grid!important}.filters{z-index:110}#fmask{z-index:105}}</style>
<script src="js/data.js"></script><script src="js/app.js"></script><script src="js/catalog.js"></script>
</body>
</html>
